<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Message Received</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f5f5f5;
            text-align: center;
        }

        .result-box {
            border: 2px solid #4CAF50;
            border-radius: 10px;
            background-color: #ffffff;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #4CAF50;
        }

        #submittedData {
            white-space: pre-wrap;
            text-align: left;
            margin-top: 20px;
            color: #333;
        }

        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="result-box">
        <h2>Your Message Has Been Sent!</h2>
        <p id="submittedData">Loading your message...</p>
        <button class="back-button" onclick="history.back()">Go Back</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const data = params.get('data');
        if (data) {
            document.getElementById('submittedData').innerText = decodeURIComponent(data);
        } else {
            document.getElementById('submittedData').innerText = "No data received.";
        }
    </script>
</body>
</html>
