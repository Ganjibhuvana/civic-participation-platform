<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Submission Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .submission-box {
            border: 2px solid #4CAF50; /* Green border */
            border-radius: 10px;
            background-color: #f9f9f9; /* Light background */
            padding: 20px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .submission-form input[type="text"],
        .submission-form textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .submit-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        .submit-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h2>Submit Your Project Idea</h2>
    <div class="submission-box">
        <div class="submission-form">
            <input type="text" id="ideaTitle" placeholder="Title of Your Idea" required>
            <textarea rows="4" placeholder="Description of Your Idea..." id="ideaDescription" required></textarea>
            <input type="text" id="contactInfo" placeholder="Your Contact Info" required>
        </div>
        <button class="submit-button" onclick="submitIdea()">Submit Idea</button>
    </div>

    <script>
        function submitIdea() {
    const title = document.getElementById('ideaTitle').value;
    const description = document.getElementById('ideaDescription').value;
    const contact = document.getElementById('contactInfo').value;

    if (title && description && contact) {
        // Encode data to safely include in URL
        const encodedData = encodeURIComponent(
            `Title: ${title}\nDescription: ${description}\nContact: ${contact}`
        );
        // Redirect to res11.html with data in query string
        window.location.href = `res12.html?data=${encodedData}`;
    } else {
        alert('Please fill out all fields in the submission form.');
    }
}

    </script>
</body>
</html>
