<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share Your Opinion</title>
</head>
<body>
  <h2>Get Involved: <span id="initiativeName"></span></h2>

  <label for="userName">Your Name:</label>
  <input type="text" id="userName" placeholder="Enter your name"><br><br>

  <label for="opinion">Your Opinion:</label><br>
  <textarea id="opinion" rows="5" cols="40" placeholder="Share your thoughts..."></textarea><br><br>

  <button onclick="submitOpinion()">Submit</button>

  <script>
    // Get initiative from URL
    const params = new URLSearchParams(window.location.search);
    const initiative = params.get("initiative");
    document.getElementById("initiativeName").textContent = initiative || "Unknown Initiative";

    function submitOpinion() {
      const name = document.getElementById("userName").value;
      const opinion = document.getElementById("opinion").value;

      if (name && opinion) {
        const response = `${name} (${initiative}): ${opinion}`;
        const queryString = encodeURIComponent(response);
        window.location.href = `res11.html?data=${queryString}`;
      } else {
        alert("Please fill in all fields.");
      }
    }
  </script>
</body>
</html>
